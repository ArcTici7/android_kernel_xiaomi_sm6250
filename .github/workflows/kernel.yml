name: SM6250 Kernel Build (Fixed Defconfig + Stable CI)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: kernel
      KBUILD_BUILD_HOST: github-actions

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout kernel source
        uses: actions/checkout@v4

      # =========================
      # DEPENDENCIES
      # =========================
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl wget zip unzip \
            build-essential bc bison flex \
            libssl-dev libelf-dev python3

      # =========================
      # LLVM 17 TOOLCHAIN
      # =========================
      - name: Setup LLVM 17
        run: |
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.4/clang+llvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xf clang+llvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          mv clang+llvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04 clang
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      # =========================
      # FIND DEFCONFIG (SAFE)
      # =========================
      - name: Locate defconfig
        run: |
          DEFCONFIG=$(find arch/arm64/configs -type f -name "miatoll_defconfig" | head -n 1)

          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: defconfig not found"
            find arch/arm64/configs -name "*miatoll*"
            exit 1
          fi

          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV
          echo "Found defconfig: $DEFCONFIG"

      # =========================
      # PREP OUT DIR
      # =========================
      - name: Prepare output directory
        run: mkdir -p out

      # =========================
      # APPLY DEFCONFIG (FIXED)
      # =========================
      - name: Apply defconfig (FIXED PATH)
        run: |
          echo "Raw DEFCONFIG: $DEFCONFIG"

          # FIX: strip ONLY arch/arm64/configs/
          DEF_REL=$(echo $DEFCONFIG | sed 's|arch/arm64/configs/||')

          echo "Relative DEFCONFIG: $DEF_REL"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 $DEF_REL

      # =========================
      # CONFIG VALIDATION
      # =========================
      - name: Validate config
        run: |
          test -f out/.config || {
            echo "CONFIG FAILED"
            exit 1
          }

      # =========================
      # UAC2 + ALSA SAFETY CHECK
      # =========================
      - name: Validate USB audio stack
        run: |
          CONFIG=out/.config

          REQUIRED="
          CONFIG_USB_GADGET
          CONFIG_USB_CONFIGFS
          CONFIG_USB_CONFIGFS_F_UAC2
          CONFIG_SND_USB_AUDIO
          "

          for c in $REQUIRED; do
            grep -q "$c=y" $CONFIG || {
              echo "ERROR: Missing $c"
              exit 1
            }
          done

          echo "UAC2 stack OK"

      # =========================
      # BUILD KERNEL
      # =========================
      - name: Build kernel
        run: |
          make -j$(nproc) O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang

      # =========================
      # VERIFY OUTPUT
      # =========================
      - name: Check build output
        run: |
          ls -lah out/arch/arm64/boot || true

      # =========================
      # ANYKERNEL3 ZIP
      # =========================
      - name: Create flashable zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

          cp out/arch/arm64/boot/Image* anykernel/ 2>/dev/null || true
          cp out/arch/arm64/boot/dtbo.img anykernel/ 2>/dev/null || true

          cd anykernel
          zip -r9 kernel.zip ./*

      # =========================
      # UPLOAD ARTIFACT
      # =========================
      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: sm6250-kernel
          path: anykernel/kernel.zip
