name: Build SM6250 Kernel (Clean USB ConfigFS Audit)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KERNEL_DIR: kernel
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: kernel
      KBUILD_BUILD_HOST: github-actions

    steps:
    # =========================
    # 1. Checkout
    # =========================
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: ArcTici7/android_kernel_xiaomi_sm6250
        ref: lineage-21
        path: kernel

    # =========================
    # 2. Dependencies
    # =========================
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev \
          git curl zip make cpio python3

    # =========================
    # 3. LLVM toolchain
    # =========================
    - name: Setup LLVM 17
      run: |
        wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.4/clang+llvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04.tar.xz
        tar -xf clang+llvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04.tar.xz
        mv clang+llvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04 clang
        echo "$(pwd)/clang/bin" >> $GITHUB_PATH

        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV

    # =========================
    # 4. Defconfig (IMPORTANT FIX)
    # =========================
    - name: Apply defconfig
      working-directory: kernel
      run: |
        mkdir -p out

        # ALWAYS use real defconfig path (no basename hacks)
        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          vendor/xiaomi/miatoll_defconfig

        echo "Defconfig applied"

    # =========================
    # 5. CLEAN USB CONFIGFS AUDIT (THIS IS KEY)
    # =========================
    - name: Audit USB ConfigFS + UAC2 presence
      working-directory: kernel
      run: |
        CONFIG=out/.config

        echo "=== USB CORE ==="
        grep CONFIG_USB_GADGET $CONFIG || exit 1
        grep CONFIG_USB_CONFIGFS $CONFIG || exit 1
        grep CONFIG_USB_LIBCOMPOSITE $CONFIG || exit 1

        echo "=== FUNCTION SUBSYSTEM CHECK ==="
        if grep -q "function/Kconfig" drivers/usb/gadget/Kconfig; then
          echo "✔ Function Kconfig included"
        else
          echo "❌ MISSING: function/Kconfig NOT sourced"
          exit 1
        fi

        echo "=== UAC2 SOURCE CHECK ==="
        if grep -R "f_uac2" -n drivers/usb/gadget/function; then
          echo "✔ UAC2 source exists"
        else
          echo "❌ NO UAC2 SOURCE IN TREE"
          exit 1
        fi

        echo "=== CONFIG SYMBOL CHECK ==="
        grep USB_CONFIGFS_F_UAC2 $CONFIG || echo "⚠ UAC2 NOT ENABLED (expected if Kconfig missing)"

    # =========================
    # 6. Build
    # =========================
    - name: Build kernel
      working-directory: kernel
      run: |
        make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1

    # =========================
    # 7. Artifact
    # =========================
    - name: Package kernel
      run: |
        mkdir -p release
        find kernel/out/arch/arm64/boot -name "Image*" -exec cp {} release/ \;

        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
        rm -rf ak3/.git

        cp release/* ak3/ || true

        cd ak3
        zip -r9 ../Kernel-SM6250.zip .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SM6250-Kernel
        path: Kernel-SM6250.zip
