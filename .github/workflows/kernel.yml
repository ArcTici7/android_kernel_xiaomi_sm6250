name: SM6250 Kernel Build (Fixed USB ConfigFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # =========================
    # 1. Clone kernel (CORRECT SOURCE)
    # =========================
    - name: Clone kernel
      run: |
        git clone --depth=1 -b lineage-21 \
          https://github.com/ArcTici7/android_kernel_xiaomi_sm6250.git kernel

    - name: Setup env
      run: |
        echo "KERNEL_DIR=kernel" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "KBUILD_BUILD_USER=kernel" >> $GITHUB_ENV
        echo "KBUILD_BUILD_HOST=github-actions" >> $GITHUB_ENV

    # =========================
    # 2. Dependencies
    # =========================
    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev \
          git curl zip make

    # =========================
    # 3. LLVM 17 (STABLE TOOLCHAIN)
    # =========================
    - name: LLVM 17
      run: |
        wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.4/clang+llvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04.tar.xz
        tar -xf clang+llvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04.tar.xz
        mv clang+llvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04 clang
        echo "$(pwd)/clang/bin" >> $GITHUB_PATH

    # =========================
    # 4. Apply defconfig (CORRECT)
    # =========================
    - name: Defconfig
      run: |
        cd kernel
        mkdir -p out

        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          vendor/xiaomi/miatoll_defconfig

    # =========================
    # 5. FIX USB CONFIGFS (REAL ISSUE FIX)
    # =========================
    - name: Fix USB gadget core
      run: |
        cd kernel

        echo "Enabling USB gadget core dependencies..."

        scripts/config --file out/.config \
          -e USB_GADGET \
          -e USB_CONFIGFS \
          -e USB_LIBCOMPOSITE

        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

    # =========================
    # 6. VERIFY USB STACK (NO FALSE FAILS)
    # =========================
    - name: Verify USB stack
      run: |
        cd kernel
        CONFIG=out/.config

        echo "=== USB CORE ==="
        grep CONFIG_USB_GADGET $CONFIG
        grep CONFIG_USB_CONFIGFS $CONFIG
        grep CONFIG_USB_LIBCOMPOSITE $CONFIG || echo "WARN: LIBCOMPOSITE missing"

        echo "=== USB FUNCTIONS ==="
        grep CONFIG_USB_CONFIGFS_F_ $CONFIG || true

        if grep -q CONFIG_USB_CONFIGFS_F_UAC2=y $CONFIG; then
          echo "✔ UAC2 ENABLED"
        elif grep -q CONFIG_USB_CONFIGFS_F_MTP=y $CONFIG; then
          echo "✔ MTP ENABLED (no UAC2)"
        else
          echo "⚠ No USB audio/MTP function enabled"
        fi

    # =========================
    # 7. BUILD KERNEL
    # =========================
    - name: Build
      run: |
        cd kernel
        make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1

    # =========================
    # 8. CHECK OUTPUT
    # =========================
    - name: Check Image
      run: |
        test -f kernel/out/arch/arm64/boot/Image.gz-dtb

    # =========================
    # 9. PACKAGE (AnyKernel3)
    # =========================
    - name: Package zip
      run: |
        cd kernel

        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
        rm -rf ak3/.git

        cp out/arch/arm64/boot/Image.gz-dtb ak3/

        cd ak3
        zip -r9 ../Kernel-SM6250.zip .

    # =========================
    # 10. Upload
    # =========================
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: kernel/Kernel-SM6250.zip
