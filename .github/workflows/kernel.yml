name: SM6250 Kernel UAC2 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel
      uses: actions/checkout@v4
      with:
        repository: ArcTici7/android_kernel_xiaomi_sm6250
        ref: lineage-21
        path: kernel

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev git make cpio python3

    - name: Setup LLVM
      run: |
        wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.4/clang+llvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04.tar.xz
        tar -xf clang+llvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04.tar.xz
        mv clang+llvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04 clang
        echo "$(pwd)/clang/bin" >> $GITHUB_PATH

    - name: Configure kernel
      working-directory: kernel
      run: |
        mkdir -p out

        DEFCONFIG=$(find arch/arm64/configs -name "*miatoll*defconfig" | head -n 1)
        echo "Using: $DEFCONFIG"

        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 ${DEFCONFIG#arch/arm64/configs/}

    - name: Enable UAC2 stack
      working-directory: kernel
      run: |
        scripts/config --file out/.config \
          -e USB_GADGET \
          -e USB_CONFIGFS \
          -e USB_LIBCOMPOSITE \
          -e USB_CONFIGFS_F_UAC2 \
          -e SND \
          -e SND_PCM \
          -e USB_U_AUDIO

        make O=out ARCH=arm64 olddefconfig

    - name: Verify UAC2
      working-directory: kernel
      run: |
        CONFIG=out/.config

        echo "=== USB STACK CHECK ==="
        grep CONFIG_USB_GADGET=y $CONFIG
        grep CONFIG_USB_CONFIGFS=y $CONFIG
        grep CONFIG_USB_LIBCOMPOSITE=y $CONFIG

        echo "=== UAC2 CHECK ==="
        grep CONFIG_USB_CONFIGFS_F_UAC2=y $CONFIG

        echo "✔ VERIFIED: UAC2 STACK PRESENT"

    - name: Build kernel
      working-directory: kernel
      run: |
        make -j$(nproc) O=out LLVM=1 LLVM_IAS=1

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-uac2
        path: kernel/out/arch/arm64/boot/Image*
