name: Kernel Build (LLVM 17 UAC2 Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential ccache curl flex git \
          libssl-dev libelf-dev dwarves python3 unzip zip

    - name: Download LLVM 17.0.4
      run: |
        mkdir clang
        curl -L -o clang.tar.xz \
        https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.4/clang+llvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04.tar.xz

        tar -xf clang.tar.xz -C clang --strip-components=1

    - name: Export toolchain
      run: |
        echo "CLANG_PATH=$PWD/clang" >> $GITHUB_ENV
        echo "$PWD/clang/bin" >> $GITHUB_PATH
        export PATH=$PWD/clang/bin:$PATH
        clang --version

    - name: Setup kernel build env
      run: |
        mkdir -p out

    - name: Defconfig
      run: |
        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 miatoll_defconfig

    - name: Build kernel
      run: |
        make -j$(nproc) O=out ARCH=arm64 \
          LLVM=1 LLVM_IAS=1 \
          CC=clang \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CROSS_COMPILE=aarch64-linux-gnu- \
          Image.gz dtbo.img

    - name: Clone AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3

    - name: Package ZIP
      run: |
        cp out/arch/arm64/boot/Image.gz AnyKernel3/
        cp out/arch/arm64/boot/dtbo.img AnyKernel3/ || true

        cd AnyKernel3
        zip -r9 kernel.zip ./*

    - name: Upload flashable zip
      uses: actions/upload-artifact@v4
      with:
        name: kernel-flashable-zip
        path: AnyKernel3/kernel.zip
