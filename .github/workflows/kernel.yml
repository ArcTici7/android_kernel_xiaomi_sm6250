name: SM6250 Kernel Build (UAC2 Detect + Stable)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    # =========================
    # 1. Clone kernel
    # =========================
    - name: Clone kernel
      run: |
        git clone https://github.com/ArcTici7/android_kernel_xiaomi_sm6250.git -b lineage-21 kernel

    - name: Set env
      run: |
        echo "KERNEL_DIR=kernel" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "KBUILD_BUILD_USER=kernel" >> $GITHUB_ENV
        echo "KBUILD_BUILD_HOST=github-actions" >> $GITHUB_ENV

    # =========================
    # 2. Dependencies
    # =========================
    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex libssl-dev libelf-dev \
          make git curl xz-utils zip

    # =========================
    # 3. LLVM 17 (CRITICAL FIX)
    # =========================
    - name: Setup LLVM 17
      run: |
        wget https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.4/clang+llvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04.tar.xz
        tar -xf clang+llvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04.tar.xz
        mv clang+llvm-17.0.4-x86_64-linux-gnu-ubuntu-22.04 clang
        echo "$(pwd)/clang/bin" >> $GITHUB_PATH

    # =========================
    # 4. Detect UAC2 support (SOURCE LEVEL)
    # =========================
    - name: Detect UAC2 in source
      run: |
        cd $KERNEL_DIR

        echo "=== SEARCHING FOR UAC2 ==="

        if grep -R "f_uac2" drivers/usb/gadget/function 2>/dev/null; then
          echo "HAS_UAC2_SRC=1" >> $GITHUB_ENV
          echo "✔ f_uac2.c found"
        else
          echo "HAS_UAC2_SRC=0" >> $GITHUB_ENV
          echo "❌ No f_uac2.c"
        fi

        grep -n "UAC2" drivers/usb/gadget/function/Kconfig || true

    # =========================
    # 5. Apply defconfig (FIXED)
    # =========================
    - name: Apply defconfig
      run: |
        cd $KERNEL_DIR
        mkdir -p out

        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 vendor/xiaomi/miatoll_defconfig

    # =========================
    # 6. Resolve config
    # =========================
    - name: olddefconfig
      run: |
        cd $KERNEL_DIR
        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

    # =========================
    # 7. Detect FINAL config (REAL RESULT)
    # =========================
    - name: Verify USB audio stack
      run: |
        cd $KERNEL_DIR
        CONFIG=out/.config

        echo "=== FINAL AUDIO CONFIG ==="

        grep -E "CONFIG_USB_CONFIGFS_F_.*" $CONFIG || true

        if grep -q CONFIG_USB_CONFIGFS_F_UAC2=y $CONFIG; then
          echo "AUDIO_MODE=UAC2" >> $GITHUB_ENV
          echo "✔ TRUE UAC2 ENABLED"
        elif grep -q CONFIG_USB_CONFIGFS_F_AUDIO_SRC=y $CONFIG; then
          echo "AUDIO_MODE=AUDIO_SRC" >> $GITHUB_ENV
          echo "⚠ Using AUDIO_SRC fallback"
        else
          echo "❌ NO USB AUDIO FUNCTION"
          exit 1
        fi

        grep CONFIG_USB_GADGET=y $CONFIG || exit 1
        grep CONFIG_USB_CONFIGFS=y $CONFIG || exit 1

    # =========================
    # 8. Build kernel
    # =========================
    - name: Build kernel
      run: |
        cd $KERNEL_DIR
        make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1

    # =========================
    # 9. Validate output
    # =========================
    - name: Validate kernel image
      run: |
        cd $KERNEL_DIR

        test -f out/arch/arm64/boot/Image.gz-dtb || {
          echo "❌ Missing Image.gz-dtb"
          exit 1
        }

        echo "✔ Kernel built successfully"

    # =========================
    # 10. Package AnyKernel3
    # =========================
    - name: Package flashable zip
      run: |
        cd $KERNEL_DIR

        git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        rm -rf AnyKernel3/.git

        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/

        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
        fi

        cd AnyKernel3
        zip -r9 ../Kernel-UAC2-SM6250.zip .

    # =========================
    # 11. Upload
    # =========================
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-UAC2-SM6250
        path: kernel/Kernel-UAC2-SM6250.zip
